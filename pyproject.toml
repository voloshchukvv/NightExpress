[build-system]
requires = ["hatchling>=1.27"]  # 1.27: SPDX license + license-files
build-backend = "hatchling.build"

[project]
name = "nightexpress"
version = "0.1.0b0"
description = "A simple IDE for comfortable work with Rust on STM32"
readme = "README.md"
license = "MIT AND 0BSD"  # the app; its project templates (see LICENSE)
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.10",
    "pyserial>=3.5",
    "pyelftools>=0.31",
    "tomlkit>=0.13",
    "Jinja2>=3.1",
    "mistune>=3.4,<4",
    "Pygments>=2.19",
    "pywinpty>=2.0; sys_platform == 'win32'",  # ConPTY for the terminal tab on Windows
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "Babel>=2.14",  # scripts/update_translations.py
]

[project.scripts]
nightexpress = "nightexpress.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nightexpress"]
# Monaco and xterm.js are git-ignored (fetched by scripts/fetch_*.py) but must ship in the wheel,
# together with their license files.
artifacts = [
    "src/nightexpress/resources/editor/monaco/**",
    "src/nightexpress/resources/terminal/xterm/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# Cyrillic in string literals is expected: the UI is in Ukrainian.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pep8-naming]
# Qt overrides such as closeEvent, sizeHint.
extend-ignore-names = ["*Event", "sizeHint", "minimumSizeHint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-m 'not hardware'"
markers = [
    "ui: widget and controller tests (pytest-qt, offscreen)",
    "hardware: need a real board and probe; run with: pytest -m hardware",
]
