# Monaco colour ids; "#rrggbbaa" adds transparency.
[editor.colors]
"editor.background" = "#ffffff"
"editor.lineHighlightBackground" = "#eef1f380"
"editorLineNumber.foreground" = "#a0a8b0"
"editorLineNumber.activeForeground" = "#1c2126"
"editorCursor.foreground" = "#11796a"
"editor.selectionBackground" = "#11796a33"
"editorIndentGuide.background1" = "#e2e6e9"
"editorGutter.background" = "#ffffff"

# Monaco token names on top of the built-in syntax colours.
[editor.tokens]
key = "#0d6c78"
type = "#855700"
